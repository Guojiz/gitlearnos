protocol: "2.0-draft"
language: en
mode: safe-auto

# This is the learner repository's only durable policy. Do not put changing
# goals, answers, gaps, or review state here.
identity:
  repo_id: "replace-with-target-repository-id"
  role: learner
  kind: learner-repository
  template: false

authorization:
  automatic_writes: true
  commits: true
  push: false
  external_publish: ask
  destructive_changes: ask

privacy:
  repository: private
  store_conversations: false
  store_originals: authorized-only
  store_sensitive_identity: necessary-and-authorized
  local_only_sources: true

sources:
  workspace: ""
  large_materials: project-sources
  store_in_git: locators-and-inspected-excerpts

rag:
  required_for_complete: true
  provider: rag-anything
  status: pending # pending | configured | verified | unavailable | failed
  working_dir: ""
  parser_output_dir: ""
  chat:
    base_url: ""
    model: ""
    api_key_env: GITLEARNOS_RAG_CHAT_API_KEY
  embedding:
    base_url: ""
    model: ""
    api_key_env: GITLEARNOS_RAG_EMBEDDING_API_KEY
    dimensions: 0 # set to the selected provider's verified dimension
  ingest:
    enabled: true
    scope: per-source # per-source | configured-folder
    authorization: explicit

setup:
  answers:
    goal: ""
    subject: ""
    material: ""
    rag_provider: rag-anything
    rag_storage: ""
  completed_at: ""

automation:
  time_zone: Asia/Shanghai
  quiet_hours: "22:00-07:00"
  max_questions_per_due_run: 3
  delivery_channel: current-authorized-channel
  jobs:
    maintenance:
      recurrence: daily
      local_time: "21:30"
    due-review:
      recurrence: daily
      local_time: "07:00"
