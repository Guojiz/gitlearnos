version: 2
# Translation example only. Effective values live in gitlearnos.yml.
timezone: "Etc/UTC" # replace with automation.time_zone
jobs:
  - id: maintenance
    intent: reconcile pending input, feedback, views, and contradictions
    recurrence: daily
    local_time: "21:30"
    schedule: provider-managed
    no_work: skip-silently
    catch_up: once
    receipt: external-receipt/v1
  - id: due-review
    intent: generate concrete questions from due evidence
    recurrence: daily
    local_time: "07:00"
    schedule: provider-managed
    no_work: skip-silently
    catch_up: once
    receipt: external-receipt/v1
